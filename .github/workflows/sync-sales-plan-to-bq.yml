name: Sync Sales Plan to BigQuery

# Exporta Firestore `sales_plan_cache/{rods,reels}` → BQ
# `shimano_app.sales_plan_rows` en long format. Alimenta la vista
# `v_plan_futuro_hoy` consumida por Power BI (misma métrica que la
# columna "Plan futuro" de la pantalla Forecast de la app).
#
# Flujo (scripts/sync_sales_plan_to_bigquery.py):
#   1. Lee ambos docs sales_plan_cache (SA key → Firestore Admin).
#   2. Expande rows[].months{} a (familia, sku, mes DATE, cantidad).
#   3. WRITE_TRUNCATE a `shimano_app.sales_plan_rows`.
#
# Cadencia: 1x/día a las 03:17 UTC (00:17 ART). Los Excels se suben manual
# ad-hoc; no hace falta sync tan frecuente. Trigger manual disponible.
#
# Offset 03:17: fuera del rango horas-pico y no choca con
#  - sync-sap-to-bigquery.yml (:08, :38)
#  - sync-sap-catalog-stock.yml (cada 5 min)
#  - map-daily.yml (16:00 ART)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo dry-run (NO escribe a BigQuery)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: sync-sales-plan-to-bq
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # Pin matching sync-sap-to-bigquery.yml (v610: google-cloud-firestore<2.29
        # por bug de encoding con '(default)' database id).
        run: pip install firebase-admin "google-cloud-firestore<2.29" "google-cloud-core<2.7" "google-api-core<2.35" google-cloud-bigquery

      - name: Run sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/sync_sales_plan_to_bigquery.py
