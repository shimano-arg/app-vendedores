name: Recover Deleted Pedido from BQ

# One-shot: busca pedidos borrados en pedidos_raw_changelog (firestore-bigquery
# -export) y genera Excel para que admin pueda ver qué contenía el doc
# borrado. Util cuando se borra un pedido por accidente o para auditoria.

on:
  workflow_dispatch:
    inputs:
      search:
        description: 'Pattern a buscar en el campo data del changelog (case-insensitive). Ej: GOITIA, REBORN, "ORDEN 328"'
        type: string
        required: true
      date_from:
        description: 'Fecha desde (YYYY-MM-DD). Default: hoy. Mas atras = query mas pesada.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: recover-deleted-pedido
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --disable-pip-version-check
             "google-cloud-bigquery==3.25.0"
             "google-cloud-core==2.4.1"
             "google-api-core==2.24.2"
             "openpyxl==3.1.5"

      - name: Run recovery
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEARCH: ${{ inputs.search }}
          DATE_FROM: ${{ inputs.date_from }}
          OUTPUT_PATH: recovered_pedidos.xlsx
        run: python scripts/recover_deleted_pedido_from_bq.py

      - name: Upload Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-pedidos
          path: recovered_pedidos.xlsx
          retention-days: 30
          if-no-files-found: warn
