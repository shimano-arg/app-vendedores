name: Snapshot costo semanal

# Snapshot semanal de sap_items_bike_raw.cost_avg_ars a
# costo_snapshot_semanal. Decision Mariano 2026-10-23: usar la foto del sync
# continuo, sin pull nuevo a SAP ni CSV.
#
# Horario: lunes 04:00 UTC = 01:00 ART. Esto garantiza que el sync de las
# 03:08 UTC (= 00:08 ART lunes) ya termino (incluso tolerando 50 min de
# duracion). La foto refleja la data SAP del fin de semana (viernes close +
# sabado/domingo sin actividad).
#
# Idempotencia: DELETE + INSERT por semana. Si workflow_dispatch corre dos
# veces el mismo lunes, pisa (mismos valores).
#
# Secrets:
#   FIREBASE_SERVICE_ACCOUNT   SA con BQ Data Editor (mismo que sync).

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY_RUN: imprime SQL sin ejecutar'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: snapshot-costo-semanal
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-cloud-bigquery

      - name: Run snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/snapshot_costo_semanal.py
