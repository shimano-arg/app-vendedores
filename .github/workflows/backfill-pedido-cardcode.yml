name: Backfill Pedido CardCode

# One-shot (y re-corrible) para resolver clientCardCode faltantes en pedidos
# Firestore. Lee 3 fuentes de mapeo nombre→cardCode (sap_bp_raw BQ + sap_clients
# Firestore + client_applications Firestore) y aplica updates con metadata
# _backfillCardCode para trace.
#
# Dry-run por default — hay que elegir explicitamente apply=true para escribir.
#
# Trigger: workflow_dispatch (solo manual desde GitHub UI).
#
# Secrets requeridos (ya existentes):
#   FIREBASE_SERVICE_ACCOUNT   JSON SA con permisos read Firestore + read BQ

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Aplicar updates (false = dry-run, true = write real)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: backfill-pedido-cardcode
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install deps
        # Mismos pins que send-stock-snapshot-email.yml.
        run: pip install --disable-pip-version-check
             "firebase-admin==6.5.0"
             "google-cloud-firestore==2.20.1"
             "google-cloud-bigquery==3.25.0"
             "google-cloud-core==2.4.1"
             "google-api-core==2.24.2"

      - name: Run backfill
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.apply == true && 'false' || 'true' }}
        run: python scripts/backfill_pedido_cardcode.py

      - name: Upload unresolved CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-unresolved
          path: backfill_pedido_cardcode_unresolved.csv
          retention-days: 30
          if-no-files-found: ignore
