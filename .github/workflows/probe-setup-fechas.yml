name: Probe SETUP fechas

# One-shot: llama directo a la API SETUP y reporta cuantas lineas devuelve
# por ventana de 7 dias (ultimas 3 semanas). Diagnostica si SETUP mismo
# esta stale vs bug nuestro en la CF.
#
# Usa el secret SETUP_API_PASSWORD ya configurado en el repo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install google-cloud-secret-manager google-auth

      - name: Leer SETUP_API_PASSWORD de GSM y probe
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GCP_PROJECT: app-vendedores-shimano
        # v937 (2026-09-14, SecAudit Sprint 2 MED-09 VULN-540): trap cleanup
        # del SA JSON EN CUALQUIER exit path. Antes: si el python fallaba
        # (SecretManager quota, timeout, etc), el `rm /tmp/sa.json` de la
        # ultima linea nunca corria y el SA JSON quedaba en la FS del runner
        # hasta que el runner se destruye. Runner es ephemeral pero el
        # blast radius durante el flight de 60-90s no era cero. Ahora el
        # trap corre siempre (incluso con set -e implicit del step).
        run: |
          set -eu
          trap 'rm -f /tmp/sa.json' EXIT
          umask 077  # cualquier archivo nuevo queda 600 (owner-only read)
          # Escribimos JSON SA a archivo temp y usamos GOOGLE_APPLICATION_CREDENTIALS
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          # Leemos secret con python (evita instalar gcloud CLI en runner)
          export SETUP_API_PASSWORD=$(python -c "
          from google.cloud import secretmanager
          from google.oauth2 import service_account
          import json, os
          sa = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          creds = service_account.Credentials.from_service_account_info(sa)
          client = secretmanager.SecretManagerServiceClient(credentials=creds)
          name = f'projects/{os.environ[\"GCP_PROJECT\"]}/secrets/SETUP_API_PASSWORD/versions/latest'
          resp = client.access_secret_version(request={'name': name})
          print(resp.payload.data.decode('utf-8'), end='')
          ")
          python scripts/probe_setup_ultimos_dias.py
