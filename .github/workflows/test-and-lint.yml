name: Test & Lint

# v379+ (2026-08-02): CI mínimo para que ningún PR llegue a main con
# tests rotos o types desalineados. Corre en cada PR + en cada push a
# main (para catchear si alguien hace push directo desde otra máquina).
#
# NO reemplaza el smoke E2E manual que Mariano hace antes del squash-merge.
# Sí garantiza que el suite de 193 unit+smoke tests + typecheck pasen SIEMPRE.
#
# Duración típica: ~1-2 min. Free tier de GH Actions cubre esto de sobra.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:

# Cancelar corridas anteriores del mismo PR/branch si llega una nueva.
# Evita gastar minutos de CI en versiones viejas del mismo cambio.
concurrency:
  group: test-and-lint-${{ github.ref }}
  cancel-in-progress: true

# v877 (2026-09-11) SEC: fix CodeQL actions/missing-workflow-permissions #21.
# Workflow read-only para test/lint — no necesita write. Principio de menor
# privilegio: si algún step maligno inyectara comandos (via deps compromise o
# script en tests), no puede modificar el repo, crear releases, ni publicar.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # v998 (2026-09-19) migrado a Node 22 antes del decomm de Node 20
          # (deadline GCP 2026-10-30). Alineado con functions/package.json engines.
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      # v379 hotfix: sin este step el typecheck rompe porque tsconfig.json
      # incluye functions/**/*.js y las deps (firebase-functions, firebase-admin,
      # @google-cloud/firestore) viven en functions/node_modules, no en root.
      - name: Install functions deps
        run: cd functions && npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # v383+ (2026-08-02): Biome lint. Guardrail principal contra bugs de
      # scope tipo v382 (regla `noUndeclaredVariables`). 213 identifiers
      # globales del inline declarados en biome.json → cualquier identifier
      # nuevo sin declarar rompe el PR ANTES de que Sentry lo capture en prod.
      - name: Lint (Biome)
        run: npm run lint

      # v3 (2026-11-02): unit/smoke con reporte JSON + gate. `|| true` deja que
      # el gate decida: falla ante cualquier falla (no hay conocidas en unit ni
      # smoke) y también si se ejecutan menos tests que el piso (minExecuted),
      # cosa que `npm run test:unit` solo no detecta.
      - name: Unit tests
        run: npx vitest run tests/unit/ --reporter=default --reporter=json --outputFile=unit-report.json || true

      - name: Gate unit (sin fallas + piso de ejecutados)
        run: node scripts/ci/check-known-failures.mjs unit unit-report.json

      - name: Smoke tests
        run: npx vitest run tests/smoke/ --reporter=default --reporter=json --outputFile=smoke-report.json || true

      - name: Gate smoke (sin fallas + piso de ejecutados)
        run: node scripts/ci/check-known-failures.mjs smoke smoke-report.json

      # ADR-0011 (2026-11-25): gate formal de bundle size.
      # Falla el PR si app.bundle.js > 3,5 MB o si algún chunks/*.js > 400 KB
      # o si el total de chunks > 2 MB. Ver docs/adr/0011-bundle-budget.md.
      - name: Bundle size budget (ADR-0011)
        run: node scripts/ci/bundle-size-check.mjs

      # C9-D4 (2026-11-03): tests Python (solo stdlib, sin red ni credenciales).
      # Cubren los guards de scripts destructivos y helpers de los syncs.
      #
      # 2026-11-19: agregado `pip install requests` porque el helper
      # `scripts/sl_http_helpers.py` (fix post-incidente BQ) usa
      # `requests.exceptions.ConnectionError/ChunkedEncodingError/SSLError`.
      # El helper es independiente de los imports pesados (google-cloud-bigquery
      # + firebase-admin) justamente para que el test corra sin esas deps,
      # pero sí necesita requests (stdlib ecosystem estándar).
      - name: Install Python test deps
        run: python3 -m pip install --user requests
      - name: Python tests
        run: |
          set -e
          n=0
          for f in tests/python/test_*.py; do
            echo "== $f"
            python3 "$f"
            n=$((n+1))
          done
          echo "archivos Python ejecutados: $n"
          test "$n" -ge 1

      # test:rules y test:functions corren en el job `security-tests` (abajo).

  # INFRA (2026-10-29): las suites de Rules y Functions (incluidas las de
  # seguridad SEC-01/02/04, D2/D3, BUG-REV y SEC-05) corren en cada PR.
  # - Rules: con el emulador real de Firestore (Java 21 + firebase-tools
  #   pinneado). Proyecto `demo-*`: imposible tocar producción.
  #   REQUIRE_EMULATOR=1 → si el emulador no levanta, la suite FALLA (no
  #   pasa en vacío).
  # - Functions: mocks (no necesitan emulador).
  # - Las fallas preexistentes están listadas en tests/known-failures.json; el
  #   gate falla ante una falla nueva o si una conocida empieza a pasar.
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      - name: Rules tests (emulador Firestore)
        env:
          REQUIRE_EMULATOR: '1'
        run: >-
          npx --yes firebase-tools@14.27.0 emulators:exec --project demo-ci --only firestore
          "npx vitest run tests/rules/ --no-file-parallelism --reporter=default --reporter=json --outputFile=rules-report.json || true"

      - name: Gate rules (fallas conocidas vs nuevas)
        run: node scripts/ci/check-known-failures.mjs rules rules-report.json

      - name: Functions tests
        run: npx vitest run tests/functions/ --reporter=default --reporter=json --outputFile=functions-report.json || true

      - name: Gate functions (fallas conocidas vs nuevas)
        run: node scripts/ci/check-known-failures.mjs functions functions-report.json

  # D8 Capa 2 (2026-11-12, informe 011): tests de INTEGRACION contra Firestore
  # emulator real para el core de auth-secrets + rate-limit. Levanta solo
  # Firestore emulator (Auth/Functions no son necesarios para estos tests;
  # el core se ejercita directo con firebase-admin apuntando al emulator).
  # REQUIRE_EMULATOR=1 garantiza que los tests NO pasen en vacio si el emulator
  # no levanta. Si Vitest no encuentra NINGUN test (archivos renombrados o
  # patron equivocado), el gate "Gate emulator (min ejecutados)" falla.
  functions-with-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (emulador Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      # Suite emulator Capa 2: auth-secrets-emulator.test.js (D8 dual-write +
      # anti-replay de TOTP) + d8-emulator-ampliado.test.js (D8 disableTotpCore
      # + rate_limits + legacy sha256) + waitlist-lock-concurrency.emulator
      # (R01 §42 F-C01, hardening 2026-11-18: lock atómico
      # revision_waitlist_locks bajo carga concurrente real, T1-T8). Todos
      # usan REQUIRE_EMULATOR=1 para gating explicito.
      - name: Emulator integration tests (D8 Capa 2 + R01 lock concurrency)
        env:
          REQUIRE_EMULATOR: '1'
        run: >-
          npx --yes firebase-tools@14.27.0 emulators:exec --project demo-ci --only firestore
          "npx vitest run tests/functions/auth-secrets-emulator.test.js tests/functions/d8-emulator-ampliado.test.js tests/functions/waitlist-lock-concurrency.emulator.test.js --reporter=default --reporter=json --outputFile=emulator-report.json || true"

      # Gate anti-falso-positivo (D8 hardening informe 012 + F-C01 2026-11-18).
      # Verifica:
      #  (a) El reporte JSON existe (si vitest crasheo antes de escribirlo,
      #      require() aborta con MODULE_NOT_FOUND = step falla).
      #  (b) numTotalTests >= 20. Con emulator operativo los 3 archivos
      #      ejecutan: auth-secrets-emulator 3 + d8-emulator-ampliado 11 +
      #      waitlist-lock-concurrency 9 (1 gating + 8 T1-T8) = 23 tests.
      #      Si emulator no arranca, solo corren los gating docs (~3) y este
      #      umbral lo detecta.
      #  (c) numFailedTests == 0.
      #  (d) Los 3 archivos esperados presentes en testResults.
      - name: Gate emulator (archivos presentes + minimo ejecutados + sin fallas)
        run: |
          node -e '
            const fs = require("fs");
            const path = "./emulator-report.json";
            if (!fs.existsSync(path)) {
              console.error("FAIL: reporte emulator-report.json no existe (vitest no corrio o crasheo)");
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(path, "utf8"));
            const n = r.numTotalTests || 0;
            const failed = r.numFailedTests || 0;
            const skipped = r.numPendingTests || 0;
            const files = (r.testResults || []).map((t) => (t.name || "").replace(/\\/g, "/"));
            console.log(`emulator: total=${n} pass=${r.numPassedTests||0} fail=${failed} skip=${skipped} files=${files.length}`);
            console.log("files:", files.map((f) => f.split("/").slice(-2).join("/")).join(", "));
            const expected = [
              "tests/functions/auth-secrets-emulator.test.js",
              "tests/functions/d8-emulator-ampliado.test.js",
              "tests/functions/waitlist-lock-concurrency.emulator.test.js",
            ];
            const missing = expected.filter((e) => !files.some((f) => f.endsWith(e)));
            if (missing.length) {
              console.error("FAIL: archivos esperados ausentes del reporte:", missing.join(", "));
              process.exit(1);
            }
            if (n < 20) {
              console.error(`FAIL: solo ${n} tests ejecutados (esperado >= 20 con emulator operativo + F-C01)`);
              process.exit(1);
            }
            if (failed > 0) {
              console.error(`FAIL: ${failed} tests fallaron`);
              process.exit(1);
            }
            console.log("OK: emulator gate pass");
          '

  # S-8 D2 (2026-11-25): red de seguridad E2E como check REQUIRED.
  # Corre los 6 escenarios E2E de P2-A.a (tests/e2e/*.emulator.test.js)
  # contra el emulador Firebase (Firestore + Auth) usando el script
  # `npm run test:e2e` definido en package.json (que a su vez envuelve
  # `firebase emulators:exec --only firestore,auth "vitest run tests/e2e/..."`).
  #
  # REQUIRE_EMULATOR=1 garantiza que si el emulador no levanta en el
  # runner, los tests FALLAN en lugar de pasar skipeados (patrón §40.8).
  # El reporte JSON se emite para que el gate anti-falso-positivo exija
  # un piso de tests ejecutados (evita el caso "no corrio ningun test
  # pero el step termino exit 0" por typo de path).
  #
  # Este job es REQUIRED: no tiene `continue-on-error`, cualquier falla
  # bloquea el PR. Rules + Functions ya tienen su propio job required
  # (`security-tests`); este es el tercer check required (E2E).
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (emulador Firestore + Auth)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install root deps
        run: npm ci

      - name: Install functions deps
        run: cd functions && npm ci

      # P2-A.a (2026-11-25): 6 tests emulator.test.js con escenarios de
      # flujos criticos (login+create+commit, scope interno, VDE roles,
      # anon sin rol, waitlist, STOCK_CHANGED). El npm script ya wrappea
      # con `firebase emulators:exec --only firestore,auth`, pero aca lo
      # invocamos via npx firebase-tools pinneado para alinearse con el
      # patron del job `security-tests` (mismo Firebase CLI version).
      # Reporte JSON para el gate anti-falso-positivo.
      - name: E2E tests (emulador Firestore + Auth)
        env:
          REQUIRE_EMULATOR: '1'
        run: >-
          npx --yes firebase-tools@14.27.0 emulators:exec --project demo-ci --only firestore,auth
          "npx vitest run tests/e2e/01-login-create-commit.emulator.test.js tests/e2e/02-interno-pareja-scope.emulator.test.js tests/e2e/03-vde-pedido-y-roles.emulator.test.js tests/e2e/04-anon-y-sin-rol.emulator.test.js tests/e2e/05-waitlist-flujo.emulator.test.js tests/e2e/06-stock-changed.emulator.test.js --reporter=default --reporter=json --outputFile=e2e-report.json"

      # Gate anti-falso-positivo E2E: mismo patron que `security-tests` y
      # `functions-with-emulator`. Verifica:
      #  (a) El reporte JSON existe (vitest no crasheo antes de escribir).
      #  (b) numTotalTests >= 6 (1 por archivo minimo, con emulator operativo
      #      los 6 archivos ejecutan al menos 1 test cada uno).
      #  (c) numFailedTests == 0.
      #  (d) Los 6 archivos E2E esperados presentes en testResults.
      - name: Gate E2E (archivos presentes + minimo ejecutados + sin fallas)
        run: |
          node -e '
            const fs = require("fs");
            const path = "./e2e-report.json";
            if (!fs.existsSync(path)) {
              console.error("FAIL: reporte e2e-report.json no existe (vitest no corrio o crasheo)");
              process.exit(1);
            }
            const r = JSON.parse(fs.readFileSync(path, "utf8"));
            const n = r.numTotalTests || 0;
            const failed = r.numFailedTests || 0;
            const skipped = r.numPendingTests || 0;
            const files = (r.testResults || []).map((t) => (t.name || "").replace(/\\/g, "/"));
            console.log(`e2e: total=${n} pass=${r.numPassedTests||0} fail=${failed} skip=${skipped} files=${files.length}`);
            console.log("files:", files.map((f) => f.split("/").slice(-2).join("/")).join(", "));
            const expected = [
              "tests/e2e/01-login-create-commit.emulator.test.js",
              "tests/e2e/02-interno-pareja-scope.emulator.test.js",
              "tests/e2e/03-vde-pedido-y-roles.emulator.test.js",
              "tests/e2e/04-anon-y-sin-rol.emulator.test.js",
              "tests/e2e/05-waitlist-flujo.emulator.test.js",
              "tests/e2e/06-stock-changed.emulator.test.js",
            ];
            const missing = expected.filter((e) => !files.some((f) => f.endsWith(e)));
            if (missing.length) {
              console.error("FAIL: archivos E2E esperados ausentes del reporte:", missing.join(", "));
              process.exit(1);
            }
            if (n < 6) {
              console.error(`FAIL: solo ${n} tests E2E ejecutados (esperado >= 6 con emulator operativo)`);
              process.exit(1);
            }
            if (failed > 0) {
              console.error(`FAIL: ${failed} tests E2E fallaron`);
              process.exit(1);
            }
            console.log("OK: E2E gate pass");
          '
