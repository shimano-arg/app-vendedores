name: Deploy to GitHub Pages

# Trigger: cada push a main + manual desde Actions.
# Reemplaza al deploy "legacy" (branch push) que dejo de funcionar el
# 2026-08-06 tras cambio de build_type: legacy -> workflow en Settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # v456 (2026-08-11): enablement:true re-enable Pages si el status
          # quedo `errored` (bug intermitente de GitHub Pages desde 2026-08-06).
          # Sin esto el step falla con `HttpError: self-signed certificate`
          # al hacer GET /repos/.../pages y prod queda atascado.
          enablement: true

      # SEC-07 (P0, 2026-10-29): publicar SOLO los archivos de la PWA.
      # Antes se subía la raíz del repo (todo el repo público: CLAUDE.md, README,
      # docs/ incl. docs/auditoria, tests/ con fixtures de prod, scripts/,
      # functions/, reglas). El script copia una allowlist explícita a _site/
      # y falla si falta un archivo requerido o si se cuela algo prohibido.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Armar sitio (allowlist)
        run: node scripts/pages/build-pages-site.mjs _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
