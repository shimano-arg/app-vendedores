name: Move Pedido to Waitlist

# One-shot: mueve un pedido Firestore `pedidos` → `revision_waitlist`.
# Util para rescatar pedidos confirmed que no se pueden mover via UI
# (el boton "Volver a lista de espera" solo funciona para stage==='pending').

on:
  workflow_dispatch:
    inputs:
      pedido_id:
        description: 'Firestore document ID del pedido en pedidos/ collection. Ej: YvtI5236iLRmcxC4fghy'
        type: string
        required: true
      apply:
        description: 'Aplicar: true = mueve real. false = dry-run (default).'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: move-pedido-to-waitlist
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --disable-pip-version-check
             "firebase-admin==6.5.0"
             "google-cloud-firestore==2.20.1"
             "google-cloud-core==2.4.1"
             "google-api-core==2.24.2"

      - name: Run move
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PEDIDO_ID: ${{ inputs.pedido_id }}
          DRY_RUN: ${{ inputs.apply == true && 'false' || 'true' }}
        run: python scripts/move_pedido_to_waitlist.py
