name: Restore Deleted Pedido to Waitlist

# One-shot: restaura un pedido BORRADO de Firestore → crea doc en
# revision_waitlist usando el ultimo snapshot conocido en el changelog BQ
# (firestore-bigquery-export). NO borra nada — el pedido ya esta borrado.
#
# Para pedidos VIVOS en Firestore usar move-pedido-to-waitlist.yml en su lugar.

on:
  workflow_dispatch:
    inputs:
      pedido_id:
        description: 'Firestore doc ID del pedido borrado. Ej: YvtI5236iLRmcxC4fghy'
        type: string
        required: true
      apply:
        description: 'Aplicar: true = crea waitlist. false = dry-run (default).'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: restore-deleted-pedido
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --disable-pip-version-check
             "firebase-admin==6.5.0"
             "google-cloud-firestore==2.20.1"
             "google-cloud-bigquery==3.25.0"
             "google-cloud-core==2.4.1"
             "google-api-core==2.24.2"

      - name: Run restore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PEDIDO_ID: ${{ inputs.pedido_id }}
          DRY_RUN: ${{ inputs.apply == true && 'false' || 'true' }}
        run: python scripts/restore_deleted_pedido_to_waitlist.py
