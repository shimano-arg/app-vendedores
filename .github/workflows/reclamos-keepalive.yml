name: Reclamos Keepalive Supabase

on:
  schedule:
    - cron: '0 10 */3 * *'  # cada 3 dias a las 10:00 UTC (07:00 ART)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/keepalive (toca Supabase)
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 https://app-reclamos-shimano.vercel.app/api/keepalive)
          echo "HTTP $code"
          cat /tmp/body
          echo
          [ "$code" = "200" ] || exit 1
