name: Send Stock Snapshot Email

# Envia el resumen diario de stock SAP (bodega 11 — Pesca Disponible Venta)
# al cierre del dia habil, dirigido a Pablo Gonzalez (gerente ventas) con
# copia a Mariano para visibilidad.
#
# Frecuencia: dias habiles (Lun-Vie) a las 16:00 hora Argentina.
# 16:00 ART = 19:00 UTC. Cron: minuto 0, hora 19, Lun-Vie.
#
# Fuente de datos: Firestore 'app_config/stock_snapshot' + 'product_catalog/*',
# ya actualizados cada 5 min por sync-sap-catalog-stock.yml. No re-pullea
# SAP SL — leer de Firestore es mas barato y evita presion extra al SL.
#
# Configuracion requerida (GitHub Secrets):
#   FIREBASE_SERVICE_ACCOUNT  JSON SA con permisos read en Firestore.
#   GMAIL_APP_PASSWORD        App password 16 chars de bot.shimano.pesca@gmail.com.

on:
  schedule:
    - cron: '0 19 * * 1-5'     # Lun-Vie 19 UTC = 16:00 hora Argentina
  workflow_dispatch:
    inputs:
      mail_to:
        description: 'Override MAIL_TO (comma-separated). Vacio = usar default.'
        type: string
        required: false
        default: ''
      mail_cc:
        description: 'Override MAIL_CC (comma-separated). Vacio = usar default.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Solo generar HTML + Excel como artefactos, no enviar mail'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: send-stock-snapshot-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install deps
        # Mismos pins que sync-sap-catalog-stock.yml (SecAudit Sprint 2 MED-08)
        run: pip install --disable-pip-version-check
             "firebase-admin==6.5.0"
             "google-cloud-firestore==2.20.1"
             "google-cloud-core==2.4.1"
             "google-api-core==2.24.2"
             "openpyxl==3.1.5"

      - name: Run send_stock_snapshot_email
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_FROM: bot.shimano.pesca@gmail.com
          # Default: Pablo Gonzalez (gerente ventas) + Mariano en CC para
          # visibilidad y debug. Se puede override via workflow_dispatch.
          MAIL_TO: ${{ inputs.mail_to != '' && inputs.mail_to || 'pablo.gonzalez@shimano.com.ar' }}
          MAIL_CC: ${{ inputs.mail_cc != '' && inputs.mail_cc || 'mariano.erbino@shimano.com.ar' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/send_stock_snapshot_email.py

      - name: Upload dry-run artifacts
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-stock-snapshot
          path: |
            _dryrun_stock_snapshot.html
            _dryrun_stock_snapshot.xlsx
          retention-days: 3
