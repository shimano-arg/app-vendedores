name: Send Rendiciones Aprobadas

# Corre todos los Lunes y Miercoles a las 9 AM hora Argentina (UTC-3).
# 9 AM AR = 12 PM UTC. Cron: minuto 0, hora 12, cualquier dia/mes,
# dia de semana Lun (1) o Mie (3).
#
# Lee de Firestore las rendiciones con status='approved' Y notifiedAt=null
# (las que aun no se mandaron), genera un Excel y lo envia por mail a
# mariano.erbino@shimano.com.ar desde bot.shimano.pesca@gmail.com.
#
# Configuracion previa requerida (GitHub Secrets):
#   FIREBASE_SERVICE_ACCOUNT  Contenido del JSON descargado de Firebase Console
#                             > Configuracion del proyecto > Cuentas de servicio.
#   GMAIL_APP_PASSWORD        App Password de 16 caracteres de bot.shimano.pesca@gmail.com.

on:
  schedule:
    - cron: '0 12 * * 1,3'     # Lun y Mie 12 UTC (9 AM AR)
  workflow_dispatch:           # boton "Run workflow" para forzar manualmente

permissions:
  contents: read

concurrency:
  group: send-rendiciones-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install firebase-admin openpyxl

      - name: Run send_rendiciones_email
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_FROM: bot.shimano.pesca@gmail.com
          MAIL_TO: mariano.erbino@shimano.com.ar
        run: python scripts/send_rendiciones_email.py
