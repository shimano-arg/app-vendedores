name: Send Rendiciones Aprobadas

# v1059 (2026-09-24): cron ajustado de 12 UTC -> 8 UTC. GitHub Actions
# dispara los cron con delay consistente de 3-5h en horario pico USA (GH
# deprioriza cron cuando la infra esta cargada). Con 8 UTC + delay ~3-5h,
# los mails caen entre 11-13 UTC = 8-10 AM AR, cerca de la ventana operativa
# que pedia Mariano. Original 12 UTC (9 AM AR) caia entre 15:20-17:15 UTC =
# 12:20-14:15 AR — demasiado tarde para revisar rendiciones a primera hora.
# Cron: minuto 0, hora 8, cualquier dia/mes, dia de semana Lun (1) o Mie (3).
#
# Lee de Firestore las rendiciones con status='approved' Y notifiedAt=null
# (las que aun no se mandaron), genera un Excel y lo envia por mail a
# mariano.erbino@shimano.com.ar + diego.valsi@shimano.uy (v762 2026-09-01: re-agregado
# tras estabilizar fix v760/v761 + fixes flow Power Automate)
# desde bot.shimano.pesca@gmail.com.
#
# Configuracion previa requerida (GitHub Secrets):
#   FIREBASE_SERVICE_ACCOUNT  Contenido del JSON descargado de Firebase Console
#                             > Configuracion del proyecto > Cuentas de servicio.
#   GMAIL_APP_PASSWORD        App Password de 16 caracteres de bot.shimano.pesca@gmail.com.

on:
  schedule:
    - cron: '0 8 * * 1,3'      # Lun y Mie 8 UTC — con delay GH ~3-5h cae 11-13 UTC (8-10 AR)
  workflow_dispatch:           # boton "Run workflow" para forzar manualmente
    inputs:
      force:
        description: 'Forzar envio con TODAS las rendiciones aprobadas (incluso las ya notificadas)'
        type: boolean
        required: false
        default: false
      skip_mark:
        description: 'Mandar el mail pero NO marcar como notificadas (para testing)'
        type: boolean
        required: false
        default: false
      replay_ids:
        description: 'IDs puntuales separados por coma (replay quirurgico, ignora status/notifiedAt)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: send-rendiciones-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        # firebase-admin trae google-cloud-storage como dep transitiva, no
        # hace falta agregarlo aparte.
        # v610 (2026-08-24): pin google-cloud-firestore<2.29.0. La 2.29.0
        # (release 2026-08-24) URL-encodes '(default)' → error "Invalid database
        # id %28default%29". Rompio los 4 workflows Python simultaneamente ~22:00 UTC.
        run: pip install firebase-admin "google-cloud-firestore<2.29" "google-cloud-core<2.7" "google-api-core<2.35" openpyxl

      - name: Run send_rendiciones_email
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_FROM: bot.shimano.pesca@gmail.com
          # v762 (2026-09-01): re-agregado diego.valsi@shimano.uy despues de estabilizar
          # los fixes v760+v761 + fixes en el flow Power Automate (if empty Importe,
          # coalesce json'[]' en Apply to each Solicitud, run-after tolerante en For each 1).
          # Historia: v609 (2026-08-24) se agrego originalmente. v761 lo removio TEMP
          # mientras testeaba. Ahora volvemos al estado normal.
          # smtplib.send_message parsea comma-separated correctamente.
          MAIL_TO: mariano.erbino@shimano.com.ar,diego.valsi@shimano.uy
          FORCE_SEND: ${{ inputs.force }}
          SKIP_MARK: ${{ inputs.skip_mark }}
          REPLAY_IDS: ${{ inputs.replay_ids }}
        run: python scripts/send_rendiciones_email.py
