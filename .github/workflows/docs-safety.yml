name: Documentation safety

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/verify-docs-safety.mjs"
      - ".github/workflows/docs-safety.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/verify-docs-safety.mjs"
      - ".github/workflows/docs-safety.yml"

permissions:
  contents: read

jobs:
  docs-safety:
    name: Documentation safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-docs-safety.mjs
