name: Sync SAP Catalog + Stock (Service Layer)

# Corre cada 30 minutos. Reemplaza al viejo Sync SAP Stock (sync-stock.yml)
# que dependia del CSV que David subia a Drive.
#
# Flujo (scripts/sync_sap_to_firestore.py):
#   1. Lee credenciales del Service Layer desde Firestore
#      (app_config/sap_integration.serviceLayer)
#   2. Login SL, iteracion Items?$select=... paginada
#   3. Escribe product_catalog/chunk_N + app_config/product_catalog_meta
#      + app_config/stock_snapshot
#   4. Los listeners del cliente reaccionan solos.
#
# Secrets requeridos:
#   FIREBASE_SERVICE_ACCOUNT   Mismo JSON usado por send-rendiciones-email.
#   SAP_SL_PASSWORD            v690 hardening: password SL server-side. Antes se
#                              leia de app_config/sap_integration.serviceLayer.password
#                              en Firestore (leak potencial admin+gerente via DevTools).
#                              Setear via Settings > Secrets > Actions.

on:
  schedule:
    # v508 (2026-08-13): cada 5 min. Antes cada 30 min (:13/:43). Cada
    # corrida tarda ~4-5 min - CABE en la ventana con concurrency guard
    # (si aun corre, la nueva se skipea). Desfasado en :02/:07/:12/:17/...
    # (offset :02) para evitar picos de GitHub Actions en :00/:05 exactos.
    #
    # Impacto:
    #   - SAP SL: ~6x mas requests/hora al Service Layer. Consultar con
    #     David si SAP-B1 lo soporta sostenido (baseline ~30 req/corrida).
    #   - GH Actions minutos: 5 min * 12 = 60 min/hora * 24 = 1440 min/dia.
    #     Repo publico -> unlimited. Repo privado -> excede free tier.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo dry-run (no escribe a Firestore, solo loguea)'
        type: boolean
        required: false
        default: false
      sl_insecure:
        description: 'Deshabilitar verify SSL en Service Layer (solo si el cert falla)'
        type: boolean
        required: false
        default: false
      max_items:
        description: 'Cap de items para test (0 = sin cap)'
        required: false
        default: '0'

permissions:
  # Necesitamos write para poder commitear stock.json cuando cambia
  # (consumido por el Google Sheet "Inventario-Bot" via GitHub Pages).
  contents: write

concurrency:
  group: sync-sap-catalog-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # Sync completo suele tardar 3-5 min. Con margen.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # v399 (2026-08-05): usar PAT de Mariano (admin) en vez del GITHUB_TOKEN
          # default. Con branch protection activa (§34.1) exigiendo el check
          # `test`, el bot github-actions[bot] no puede pushear a main —
          # remote rechaza con "Required status check 'test' is expected".
          # Como enforce_admins=false, un push firmado por un admin (Mariano)
          # sí bypassea el check. El PAT tiene que ser fine-grained con
          # permission `Contents: Read and write` para este repo.
          # Si el secret no existe, checkout cae al GITHUB_TOKEN default
          # (workflow igual corre, solo falla el commit del stock.json legacy).
          token: ${{ secrets.SYNC_BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # v610 (2026-08-24): pin google-cloud-firestore<2.29.0. La 2.29.0
        # (release 2026-08-24) URL-encodes '(default)' → error "Invalid database
        # id %28default%29". Rompio los 4 workflows Python simultaneamente ~22:00 UTC.
        run: pip install firebase-admin "google-cloud-firestore<2.29" "google-cloud-core<2.7" "google-api-core<2.35" requests

      - name: Run sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SAP_SL_PASSWORD: ${{ secrets.SAP_SL_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          SL_INSECURE: ${{ inputs.sl_insecure }}
          SL_MAX_ITEMS: ${{ inputs.max_items }}
        run: python scripts/sync_sap_to_firestore.py

      - name: Commit stock.json if changed
        # stock.json es consumido por el Google Sheet "Inventario-Bot" via
        # GitHub Pages (shimano-arg.github.io/app-vendedores/stock.json). Si
        # el sync detecto cambios, commiteamos y pusheamos.
        # No corre en dry-run.
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ ! -f .stock_json_changed ]; then
            echo "::notice::stock.json no cambio, no commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock.json
          if git diff --cached --quiet; then
            echo "::notice::git dice que no hay diff en stock.json (safety net), no commit"
            exit 0
          fi
          git commit -m "stock.json: auto-sync $(date -u +%Y-%m-%dT%H:%MZ)"
          # Pull + rebase por si hubo pushes concurrentes (poco probable pero
          # como corremos cada 30 min, si alguien commiteo justo se evita el
          # non-fast-forward error).
          git pull --rebase origin main || true
          git push
          echo "::notice::stock.json actualizado y pusheado"
          rm -f .stock_json_changed
