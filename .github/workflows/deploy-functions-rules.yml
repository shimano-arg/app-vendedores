name: Deploy Functions + Rules

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      dry_run:
        description: 'Enable dry-run (no actual deployment)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'

env:
  NODE_VERSION: '20.x'
  DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
  TARGET_ENV: ${{ github.event.inputs.environment || 'production' }}

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint functions
        run: npm run lint:functions || echo "⚠ Lint warnings (non-blocking)"

      - name: Validate Firestore rules syntax
        run: |
          if [ -f "firestore.rules" ]; then
            echo "✓ Firestore rules file exists"
            # Basic syntax check: ensure valid rule structure
            grep -q "^service cloud.firestore" firestore.rules || { echo "✗ Invalid Firestore rules syntax"; exit 1; }
          fi
          echo "✓ Rules syntax validation passed"

      - name: Validate Storage rules syntax
        run: |
          if [ -f "storage.rules" ]; then
            echo "✓ Storage rules file exists"
            grep -q "^service firebase.storage" storage.rules || { echo "✗ Invalid Storage rules syntax"; exit 1; }
          fi
          echo "✓ Rules syntax validation passed"

  dry_run:
    name: Dry-Run with Emulators
    runs-on: ubuntu-latest
    needs: lint
    if: env.DRY_RUN == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Preview deployment (dry-run)
        run: |
          echo "🔍 Previewing Functions and Rules deployment..."
          echo "TARGET_ENV: ${{ env.TARGET_ENV }}"

          # Check Firebase config
          if [ ! -f ".firebaserc" ]; then
            echo "✗ .firebaserc not found"
            exit 1
          fi

          echo "📋 Functions to deploy:"
          find functions -name "index.js" -type f | head -20

          echo "📋 Rules to deploy:"
          [ -f "firestore.rules" ] && echo "  - firestore.rules"
          [ -f "storage.rules" ] && echo "  - storage.rules"

          echo ""
          echo "⚠ DRY-RUN MODE: No actual deployment will occur"
          echo "To enable real deployment, re-run with dry_run=false and ensure FIREBASE_TOKEN is set"

      - name: Validate Firebase config
        run: |
          cat .firebaserc | jq . || { echo "✗ Invalid .firebaserc JSON"; exit 1; }

      - name: Check functions/ structure
        run: |
          if [ -d "functions" ]; then
            echo "✓ Functions directory exists"
            [ -f "functions/package.json" ] && echo "✓ functions/package.json present" || echo "⚠ functions/package.json missing"
            [ -f "functions/.env" ] || echo "⚠ functions/.env not found (optional)"
            [ -f "functions/.env.local" ] || echo "⚠ functions/.env.local not found (optional, OK for CI)"
          else
            echo "⚠ Functions directory does not exist"
          fi

      - name: Dry-run summary
        run: |
          echo "=== DRY-RUN SUMMARY ==="
          echo "Environment: ${{ env.TARGET_ENV }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Status: ✅ PREVIEW COMPLETE (no changes deployed)"
          echo ""
          echo "Next steps to enable real deployment:"
          echo "1. Ensure FIREBASE_TOKEN secret is set in repository settings"
          echo "2. Re-run workflow with dry_run=false"
          echo "3. Review changes in GitHub Actions logs"

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: lint
    if: env.DRY_RUN == 'false'
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Check FIREBASE_TOKEN secret
        run: |
          if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "❌ FIREBASE_TOKEN secret not configured"
            echo "Setup instructions:"
            echo "1. Run: firebase login:ci"
            echo "2. Copy token from output"
            echo "3. Add to repo secrets as FIREBASE_TOKEN"
            echo ""
            echo "For now, exiting gracefully (workflow_dispatch requires manual verification)"
            exit 1
          fi
          echo "✓ FIREBASE_TOKEN is configured"

      - name: Deploy Functions and Rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "🚀 Deploying to Firebase (${{ env.TARGET_ENV }})..."

          # Set Firebase project based on environment
          if [ "${{ env.TARGET_ENV }}" = "staging" ]; then
            export FIREBASE_PROJECT="app-vendedores-staging"
          else
            export FIREBASE_PROJECT="app-vendedores-prod"
          fi

          # Deploy with token
          firebase deploy \
            --token "$FIREBASE_TOKEN" \
            --project "$FIREBASE_PROJECT" \
            --only "functions,firestore:rules,storage" \
            --non-interactive \
            2>&1 | tee deploy.log

          echo ""
          echo "✅ Deployment complete"

      - name: Post-deploy smoke tests
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: success()
        run: |
          echo "🔥 Running smoke tests post-deployment..."

          # Verify functions are deployed
          firebase functions:list --token "${{ secrets.FIREBASE_TOKEN }}" | head -20

          echo "✓ Functions listed successfully"
          echo ""
          echo "⚠ Note: Full integration tests should be run manually in staging first"

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log-${{ github.run_id }}
          path: deploy.log
          retention-days: 30

  rollback:
    name: Manual Rollback (Trigger)
    runs-on: ubuntu-latest
    if: failure() && env.DRY_RUN == 'false'
    needs: deploy
    steps:
      - name: Rollback instructions
        run: |
          echo "⚠️ DEPLOYMENT FAILED - ROLLBACK INFORMATION"
          echo ""
          echo "To rollback, use one of these methods:"
          echo ""
          echo "1. Manual rollback via GCP Console:"
          echo "   gcloud run services update-traffic FUNCTION_NAME \\"
          echo "     --to-revisions=REVISION_NAME=100 \\"
          echo "     --region=us-central1"
          echo ""
          echo "2. Revert last commit:"
          echo "   git revert ${{ github.sha }}"
          echo "   git push origin main"
          echo ""
          echo "3. Re-run previous Firebase deploy from artifact"
          echo ""
          echo "Contact: DevOps team for manual rollback authorization"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, dry_run]
    if: always()
    steps:
      - name: Deployment Status Summary
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ PASSED"
          else
            STATUS="❌ FAILED"
          fi

          echo "=== WORKFLOW EXECUTION SUMMARY ==="
          echo "Status: $STATUS"
          echo "Environment: ${{ env.TARGET_ENV }}"
          echo "Dry-Run: ${{ env.DRY_RUN }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
