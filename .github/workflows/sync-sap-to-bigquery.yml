name: Sync SAP to BigQuery

# Corre cada 30 min. Complementa al sync-sap-catalog-stock.yml (que va a
# Firestore para el frontend). Este va directo a BigQuery para el pipeline
# Power BI:
#
# Flujo (scripts/sync_sap_to_bigquery.py):
#   1. Lee credenciales SL desde Firestore (app_config/sap_integration)
#   2. Login SL, fetch de BusinessPartners + Items + Invoices + Quotations
#   3. Truncate + load a las 4 tablas sap_*_raw en shimano_app (BQ)
#
# Secrets requeridos:
#   FIREBASE_SERVICE_ACCOUNT   Mismo JSON usado por los otros workflows.
#                              El SA (firebase-adminsdk-fbsvc) ya tiene
#                              BQ Data Editor + Studio User desde el
#                              backfill 2026-07-07.

on:
  schedule:
    # v757 (2026-08-31): vuelta a cada 30 min (era cada 15 desde v508).
    # Motivo: los weekends GitHub Actions cron scheduler skipea runs cuando
    # el runner esta saturado — el 2026-08-31 hubo un gap de 4.5 horas sin
    # sync (Mariano reporto facturas ausentes en tablero SAR). Con intervalo
    # de 15 min contra runs de 33-37 min, la concurrency guard skipea 100%
    # de las alternantes; el intervalo real efectivo era ~30 min anyway.
    # Volver a 30 min explicito reduce load del GH scheduler + hace explicito
    # el intervalo real.
    #
    # Offset :08/:38 para NO chocar con sync-sap-catalog-stock (que corre en
    # :02/:07/:12/:17/... cada 5 min).
    - cron: '8,38 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo dry-run (no escribe a BigQuery, solo loguea)'
        type: boolean
        required: false
        default: false
      sl_insecure:
        description: 'Deshabilitar verify SSL en Service Layer'
        type: boolean
        required: false
        default: false
      max_docs:
        description: 'Cap de docs por endpoint (0 = sin cap, util para test)'
        required: false
        default: '0'
      history_months:
        description: 'Meses de historial de Invoices/Quotations (default 24)'
        required: false
        default: '24'

permissions:
  contents: read

concurrency:
  group: sync-sap-to-bigquery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # v289 iter4 (2026-07-10): despues del fix de paginado empezamos a traer
    # todos los docs (antes se cortaba en pag 1). Con 4 endpoints x cientos de
    # paginas cada uno (Invoices/Quotations/Orders + PurchaseOrders eventualmente),
    # 20 min no alcanzo. Subimos a 45 min con margen holgado.
    # 2026-08-03: subido a 60 min despues de agregar DeliveryNotes (fetch
    # inicial ~7-10 min extra con 9k+ deliveries en ventana 12 meses) +
    # margen si SAP viene lento (hoy los otros fetches tardaron 40 min vs
    # 3-4 normal - problema de red intermitente en Seidor).
    # 2026-11-05 (v1553): subido a 180 min despues de agregar fetch per-doc
    # paralelo de PaymentInvoices (RCT2) sobre ~14k pagos del bloque COBRANZAS-B.
    # El primer run post-v1553 fue cancelled a 60 min exactos sin llegar a
    # escribir `sap_incoming_payment_invoices_raw` (quedo procesando la pag 28
    # de IncomingPayments headers). Con 8 workers, el fetch de RCT2 agrega
    # ~15-20 min sobre el baseline anterior. 180 da margen holgado.
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # v610 (2026-08-24): pin google-cloud-firestore<2.29.0. La 2.29.0
        # (release 2026-08-24) URL-encodes '(default)' → error "Invalid database
        # id %28default%29". Rompio los 4 workflows Python simultaneamente ~22:00 UTC.
        run: pip install firebase-admin "google-cloud-firestore<2.29" "google-cloud-core<2.7" "google-api-core<2.35" requests google-cloud-bigquery

      - name: Run sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SAP_SL_PASSWORD: ${{ secrets.SAP_SL_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          SL_INSECURE: ${{ inputs.sl_insecure }}
          SL_MAX_DOCS: ${{ inputs.max_docs }}
          HISTORY_MONTHS: ${{ inputs.history_months }}
          # 2026-11-19: alineado con functions/certs/godaddy_bundle.pem (fix Node
          # PR #1374). Seidor renovo el cert Tomcat el 2026-11-17 y su cadena
          # no incluye el root Go Daddy G2 → urllib3 reporta "self-signed" y
          # falla en sl_login. Apuntando session.verify al PEM provisto por
          # Seidor cerramos la cadena manteniendo TLS validado.
          # Fix Python: PR #1389 (mergeado en main 2026-11-19).
          SL_CA_BUNDLE: functions/certs/godaddy_bundle.pem
        run: python scripts/sync_sap_to_bigquery.py

      - name: Notify failure (email a erbinomariano@gmail.com)
        # 2026-11-19 fix post-incidente BQ: cuando el sync falla, mandamos email
        # para no perder 3 días silenciosos como en el incidente 2026-11-17 que
        # no se notó hasta el refresh manual de Power BI el 2026-11-19.
        # Patrón replicado de sync-sap-catalog-stock.yml (v1456 §60 UPDATE).
        if: ${{ failure() }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_FROM: bot.shimano.pesca@gmail.com
          MAIL_TO: erbinomariano@gmail.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          pwd = os.environ.get('GMAIL_APP_PASSWORD', '')
          if not pwd:
              print('::warning::GMAIL_APP_PASSWORD no configurada; skip notify')
              raise SystemExit(0)
          body = (
              f"Workflow 'Sync SAP to BigQuery' fallo.\n\n"
              f"Repo:    {os.environ.get('REPO','')}\n"
              f"Trigger: {os.environ.get('TRIGGER','')}\n"
              f"Run:     {os.environ.get('RUN_URL','')}\n\n"
              f"Impacto: tablas sap_*_raw en BigQuery desactualizadas →\n"
              f"Power BI muestra datos viejos para toda la organización.\n\n"
              f"Revisa los logs del run para causa raiz (conexion SL, SSL,\n"
              f"HTTP 400 por schema items, timeout, etc.).\n\n"
              f"Si el fallo persiste cada 30 min, considerar pausar el cron\n"
              f"(comentar schedule en .github/workflows/sync-sap-to-bigquery.yml)\n"
              f"hasta resolver la causa."
          )
          msg = MIMEText(body, 'plain', 'utf-8')
          msg['Subject'] = (
              f"[APP VENDEDORES] Sync SAP → BigQuery FALLO "
              f"({os.environ.get('TRIGGER','?')}, run {os.environ.get('RUN_ID','')})"
          )
          msg['From'] = os.environ.get('MAIL_FROM', '')
          msg['To']   = os.environ.get('MAIL_TO', '')
          with smtplib.SMTP_SSL('smtp.gmail.com', 465, timeout=30) as s:
              s.login(os.environ['MAIL_FROM'], pwd)
              s.send_message(msg)
          print(f"notify email enviado a {os.environ.get('MAIL_TO','')}")
          PY
