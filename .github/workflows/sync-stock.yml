name: Sync SAP Stock (LEGACY - CSV Drive)

# DEPRECADO desde v245: reemplazado por sync-sap-catalog-stock.yml, que
# consulta directo el Service Layer de SAP en vez de depender del CSV que
# David subia manualmente a Drive. Este workflow queda con solo trigger
# manual (workflow_dispatch) por si se necesita restaurar el flujo viejo
# temporalmente.
#
# Configuracion previa (si se dispara manual):
#   Settings -> Secrets and variables -> Actions
#     Name:  SAP_STOCK_CSV_URL
#     Value: URL publica del CSV (Google Drive direct download recomendado)

on:
  # schedule: DESACTIVADO. Ahora corre sync-sap-catalog-stock.yml.
  workflow_dispatch:           # boton "Run workflow" para forzar manualmente

permissions:
  contents: write              # necesario para commitear stock.json

concurrency:
  group: sync-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync script
        env:
          SAP_STOCK_CSV_URL: ${{ secrets.SAP_STOCK_CSV_URL }}
        run: python scripts/sync_stock.py

      - name: Commit stock.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- stock.json; then
            echo "::notice::Sin cambios en stock.json - no commit"
          else
            git add stock.json
            git commit -m "stock: auto-sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "::notice::stock.json actualizado"
          fi
