name: frontend-new CI

# Corre en cada PR que toque frontend-new/ o scripts/perf/.
# No bloquea merges a main del CRM legacy — es gate independiente para la nueva app.

on:
  pull_request:
    paths:
      - 'frontend-new/**'
      - 'scripts/perf/measure-vitals-app2.js'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend-new/**'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-new
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install (incluye deps opcionales de Playwright en install-later-step)
        run: npm ci

      - name: Biome check
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build (vite build)
        run: npm run build

      - name: Bundle size report (ADR-011 informativo — no bloquea)
        run: |
          echo "## Frontend-new bundle sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          (cd ../app2-dist && find . -name "*.js" -o -name "*.css" | xargs -I {} sh -c 'echo "$(stat -c%s "{}" | numfmt --to=iec) {}"') >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: app2-dist
          path: app2-dist
          retention-days: 7

  lighthouse-stub:
    # Placeholder — en P1.6 corre lighthouse-ci contra el preview de la build.
    # Hoy solo valida que el preview levante.
    runs-on: ubuntu-latest
    needs: typecheck-test-build
    defaults:
      run:
        working-directory: frontend-new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-new/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: app2-dist
          path: app2-dist
      - name: Smoke preview
        run: |
          npm run preview -- --port 4173 --strictPort &
          PREVIEW_PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:4173/app2/ > /dev/null
          kill $PREVIEW_PID || true
